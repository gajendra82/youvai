    <!-- Firebase SDK - Load before Flutter with comprehensive error handling -->
    <script>
      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyAlg92sDvJb8xmuMt8yA9MtjbWrHMWV1oY",
        authDomain: "youvai-56995.firebaseapp.com",
        projectId: "youvai-56995",
        storageBucket: "youvai-56995.appspot.com",
        messagingSenderId: "377693730311",
        appId: "1:377693730311:web:24dfc047db461c18c3dca2"
      };

      // Global Firebase status
      window.firebaseReady = false;
      window.firebaseError = null;

      // Function to initialize Firebase
      function initializeFirebase() {
        if (typeof firebase !== 'undefined') {
          try {
            // Check if Firebase is already initialized
            if (firebase.apps && firebase.apps.length > 0) {
              console.log('Firebase already initialized');
              window.firebaseReady = true;
              return true;
            }

            firebase.initializeApp(firebaseConfig);
            console.log('Firebase initialized successfully in web');
            window.firebaseReady = true;
            return true;
          } catch (error) {
            console.error('Firebase initialization error:', error);
            window.firebaseError = error.message;
            return false;
          }
        } else {
          console.error('Firebase SDK not loaded');
          window.firebaseError = 'Firebase SDK not loaded';
          return false;
        }
      }

      // Load Firebase SDKs with comprehensive error handling
      function loadFirebaseSDK() {
        console.log('Starting Firebase SDK loading...');
        
        const scripts = [
          'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js',
          'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js',
          'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js'
        ];

        let loadedCount = 0;
        let errorCount = 0;
        const totalScripts = scripts.length;

        scripts.forEach((src, index) => {
          const script = document.createElement('script');
          script.src = src;
          script.async = false; // Load synchronously to ensure order
          
          script.onload = () => {
            loadedCount++;
            console.log(`Loaded Firebase script ${index + 1}/${totalScripts}: ${src}`);
            
            if (loadedCount === totalScripts) {
              console.log('All Firebase scripts loaded, initializing...');
              setTimeout(() => {
                initializeFirebase();
              }, 200);
            }
          };
          
          script.onerror = () => {
            errorCount++;
            console.error(`Failed to load Firebase script: ${src}`);
            
            // Try alternative CDN if main one fails
            if (src.includes('gstatic.com')) {
              const altScript = document.createElement('script');
              altScript.src = src.replace('gstatic.com', 'firebaseapp.com');
              altScript.async = false;
              altScript.onload = () => {
                loadedCount++;
                console.log(`Loaded Firebase script from alternative CDN: ${src}`);
                if (loadedCount === totalScripts) {
                  setTimeout(() => {
                    initializeFirebase();
                  }, 200);
                }
              };
              altScript.onerror = () => {
                loadedCount++;
                console.error(`Alternative CDN also failed for: ${src}`);
                if (loadedCount === totalScripts) {
                  setTimeout(() => {
                    initializeFirebase();
                  }, 200);
                }
              };
              document.head.appendChild(altScript);
            } else {
              loadedCount++;
              if (loadedCount === totalScripts) {
                setTimeout(() => {
                  initializeFirebase();
                }, 200);
              }
            }
          };
          
          document.head.appendChild(script);
        });
      }

      // Wait for DOM to be ready, then load Firebase
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadFirebaseSDK);
      } else {
        loadFirebaseSDK();
      }

      // Fallback: If Firebase fails to load after 10 seconds, continue anyway
      setTimeout(() => {
        if (!window.firebaseReady) {
          console.warn('Firebase failed to load within 10 seconds, continuing without Firebase');
          window.firebaseReady = true; // Allow app to continue
        }
      }, 10000);
    </script>
    
    <!-- Flutter Bootstrap - Load after Firebase -->
    <script>
      // Wait for Firebase to be ready before loading Flutter
      function loadFlutter() {
        console.log('Loading Flutter...');
        const script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }

      // Check Firebase status and load Flutter
      function checkAndLoadFlutter() {
        if (window.firebaseReady) {
          loadFlutter();
        } else {
          // Wait a bit more for Firebase
          setTimeout(checkAndLoadFlutter, 500);
        }
      }

      // Start checking after 1 second
      setTimeout(checkAndLoadFlutter, 1000);
    </script>
    
    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <script>
      function openRazorpayCheckout(orderId, key, amount, name, email, number) {
        var options = {
          key: key,
          amount: amount,
          currency: "INR",
          name: "Globalspace",  
          description: "Subscription Payment",
          handler: function (response) {
            // Send success to Flutter
            console.log("Payment successful: ", response);
            
            if (window.flutterPaymentSuccess) {
              window.flutterPaymentSuccess(response.razorpay_payment_id);
            }
          },
          prefill: {
            name: name,
            email: email,
            contact: number,
          },
          theme: {
            color: "#663635", 
          },
        };
        var rzp = new Razorpay(options);
        rzp.open();
      }
    </script>
