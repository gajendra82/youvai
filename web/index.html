<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="skin_assessment" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>skin_assessment</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      function openRazorpayCheckout(orderId, key, amount, name, email, number) {
        var options = {
          key: key,
          amount: amount,
          currency: "INR",
          name: "Globalspace",  
          description: "Subscription Payment",
          handler: function (response) {
            // Send success to Flutter
            console.log("Payment successful: ", response);
            
            if (window.flutterPaymentSuccess) {
              window.flutterPaymentSuccess(response.razorpay_payment_id);
            }
          },
          prefill: {
            name: name,
            email: email,
            contact: number,
          },
          theme: {
            color: "#663635", 
          },
        };
        var rzp = new Razorpay(options);
        rzp.open();
      }
    </script>
  </body>
</html>
