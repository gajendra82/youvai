    <!-- Face Detection Script - Eyes + Nose + Cheeks gating -->
<!-- Auto-detection + auto-capture (lazy & non-blocking) -->
<script>
(function () {
  'use strict';

  const LOAD_TIMEOUT_MS = 20000;
  const REQUIRED_STABLE_FRAMES = 10;

  let preloadedModel = null;
  let model = null, modelReady = false;
  let videoEl = null, detectionActive = false;
  let captureInProgress = false, countdownActive = false;
  let statusEl, ovalEl, countdownTimer = null;
  let stableFaceCount = 0;
  let lastOkAll = false; // tracks if last detection was valid

  /* ---------------- Helpers ---------------- */
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) return resolve();
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load ' + src));
      document.head.appendChild(s);
    });
  }

  async function loadModelWithTimeout() {
    if (preloadedModel) return preloadedModel;
    const abort = new Promise((_, rej) =>
      setTimeout(() => rej(new Error('Model load timeout')), LOAD_TIMEOUT_MS)
    );
    const load = (async () => {
      if (!window.tf) await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0");
      if (!window.blazeface) await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7");
      return blazeface.load({ maxFaces: 1 });
    })();
    preloadedModel = await Promise.race([load, abort]);
    return preloadedModel;
  }

  // preload model in background
  window.addEventListener("load", () => {
    setTimeout(async () => {
      try {
        preloadedModel = await loadModelWithTimeout();
        console.log("✅ BlazeFace preloaded");
      } catch (e) {
        console.warn("Preload failed", e);
      }
    }, 500);
  });

  /* ---------------- Face validation ---------------- */
  const _norm = (pt, vw, vh) => ({x:pt[0]/vw,y:pt[1]/vh});
  const _deg = rad => rad*(180/Math.PI);

  function poseOK(pred, vw, vh){
    const L = pred.landmarks || []; if (!L || L.length < 3) return false;
    const rightEye=_norm(L[0],vw,vh), leftEye=_norm(L[1],vw,vh), nose=_norm(L[2],vw,vh);
    if (!isFinite(rightEye.x) || !isFinite(leftEye.x)) return false;
    const dx=leftEye.x-rightEye.x, dy=leftEye.y-rightEye.y;
    const eyeDist=Math.hypot(dx,dy), roll=_deg(Math.atan2(dy,dx));
    const levelOK=Math.abs(roll)<=8;
    const eyesInBand = rightEye.y>0.20&&rightEye.y<0.60 && leftEye.y>0.20&&leftEye.y<0.60;
    const scaleOK = eyeDist>0.10 && eyeDist<0.35;
    if (!(eyesInBand && scaleOK && levelOK)) return false;
    const midX=(leftEye.x+rightEye.x)/2, avgY=(leftEye.y+rightEye.y)/2;
    const noseCenteredX=Math.abs(nose.x-midX)<=eyeDist*0.30;
    const noseBelow = nose.y>avgY && nose.y<avgY+0.30;
    return (noseCenteredX && noseBelow);
  }
  function boxOK(box){
    const min=0.18,max=0.75,tol=0.20;
    if (box.width<min||box.height<min||box.width>max||box.height>max) return false;
    const cx=box.x+box.width/2, cy=box.y+box.height/2;
    return Math.abs(cx-0.5)<=tol && Math.abs(cy-0.5)<=tol;
  }

  /* ---------------- UI helpers ---------------- */
  function injectStyles() {
    if (document.getElementById("fd-styles")) return;
    const css = `
      .fd-status{position:fixed;top:30px;left:50%;transform:translateX(-50%);
        background:rgba(0,0,0,.9);color:#fff;padding:12px 20px;border-radius:25px;
        font:600 16px system-ui;z-index:10000;display:none}
      .fd-status.success{background:rgba(0,200,0,.9)}
      .fd-status.warning{background:rgba(255,149,0,.9)}
      .fd-status.countdown{background:rgba(0,150,255,.9);font-size:24px}
      .fd-oval{position:fixed;border:3px solid #00c853;border-radius:50%;
        background:rgba(0,200,83,.08);z-index:9999;pointer-events:none;display:none}
      .fd-oval.warn{border-color:#ff9500;background:rgba(255,149,0,.07)}
    `;
    const s = document.createElement("style");
    s.id = "fd-styles";
    s.textContent = css;
    document.head.appendChild(s);
  }
  function ensureStatus() { if (!statusEl) { statusEl=document.createElement("div"); statusEl.className="fd-status"; document.body.appendChild(statusEl); } }
  function setStatus(text, tone) {
    ensureStatus();
    statusEl.textContent = text;
    statusEl.className = "fd-status";
    if (tone) statusEl.classList.add(tone);
    statusEl.style.display = "block";
  }
  function ensureOval(){ if (!ovalEl){ ovalEl=document.createElement("div"); ovalEl.className="fd-oval"; document.body.appendChild(ovalEl); } }
  function hideOval(){ if (ovalEl) ovalEl.style.display='none'; }
  function setOval(videoEl, x, y, w, h, warn) {
    ensureOval();
    const r = videoEl.getBoundingClientRect();
    const vw = videoEl.videoWidth || 1, vh = videoEl.videoHeight || 1;
    const scale = Math.max(r.width / vw, r.height / vh);
    const cx = (x + w / 2) * scale, cy = (y + h / 2) * scale;
    const ow = w * scale * 1.18, oh = h * scale * 1.26;
    const left = r.left + cx - ow / 2, top = r.top + cy - oh / 2;
    ovalEl.style.left = left + "px"; ovalEl.style.top = top + "px";
    ovalEl.style.width = ow + "px"; ovalEl.style.height = oh + "px";
    ovalEl.classList.toggle("warn", !!warn);
    ovalEl.style.display = "block";
  }

  /* ---------------- Detection ---------------- */
  async function detectLoop() {
    if (!detectionActive || !modelReady || !videoEl) {
      requestAnimationFrame(detectLoop);
      return;
    }
    try {
      const preds = await model.estimateFaces(videoEl, false);
      const vw=videoEl.videoWidth, vh=videoEl.videoHeight;
      if (!preds || !preds.length) {
        hideOval(); setStatus("Position your face","warning");
        stableFaceCount = 0; lastOkAll = false;
      } else {
        const p=preds[0]; const [x,y]=p.topLeft, [xr,yb]=p.bottomRight;
        const box={x:x/vw,y:y/vh,width:(xr-x)/vw,height:(yb-y)/vh};
        const okAll = poseOK(p,vw,vh) && boxOK(box);
        lastOkAll = okAll; // track last validity
        setOval(videoEl, x,y, xr-x, yb-y, !okAll);

        if (okAll) {
          setStatus("Perfect! Hold still…","success");
          if (!captureInProgress && !countdownActive) {
            stableFaceCount++;
            if (stableFaceCount >= REQUIRED_STABLE_FRAMES) startCountdown();
          }
        } else {
          setStatus("Adjust your position","warning");
          stableFaceCount = 0;
        }
      }
    } catch (e) {}
    requestAnimationFrame(detectLoop);
  }

  function startCountdown() {
    countdownActive = true;
    let n = 3;
    statusEl.className = "fd-status countdown";
    statusEl.textContent = String(n);

    countdownTimer = setInterval(() => {
      if (!lastOkAll) { // cancel if face moved
        clearInterval(countdownTimer);
        countdownTimer = null;
        countdownActive = false;
        stableFaceCount = 0;
        setStatus("Adjust your position","warning");
        return;
      }
      n--;
      if (n > 0) statusEl.textContent = String(n);
      else {
        clearInterval(countdownTimer);
        countdownTimer = null;
        countdownActive = false;
        captureFaceImage();
      }
    }, 1000);
  }

  function captureFaceImage() {
    if (!videoEl) return;
    captureInProgress = true;
    setStatus("📸 Capturing…","success");
    const c=document.createElement("canvas"); c.width=videoEl.videoWidth; c.height=videoEl.videoHeight;
    const ctx=c.getContext("2d"); ctx.scale(-1,1); ctx.drawImage(videoEl,-c.width,0);
    c.toBlob((blob)=>{
      if(!blob) return;
      const r=new FileReader();
      r.onload=()=>{ try{
        const base64=String(r.result).split(",")[1];
        sendToFlutter({type:"face_captured", imageData:base64, width:c.width, height:c.height, timestamp:Date.now(), success:true});
        cleanup();
      }catch(_){} };
      r.readAsDataURL(blob);
    },"image/jpeg",0.95);
  }

  function sendToFlutter(message){ 
    try{window.postMessage(message,"*"); if(window.parent&&window.parent!==window)window.parent.postMessage(message,"*");}catch(_){} 
  }

  function cleanup(){
    detectionActive=false; hideOval();
    if (statusEl) statusEl.style.display="none";
    captureInProgress=false; countdownActive=false; stableFaceCount=0; lastOkAll=false;
  }

  /* ---------------- API ---------------- */
  async function initializeFaceDetection(){
    injectStyles();
    setStatus("Loading AI model…");
    try {
      model = preloadedModel || await loadModelWithTimeout();
      modelReady = true;
    } catch(e){ setStatus("Model failed","warning"); return; }

    let tries=0;
    const timer=setInterval(()=>{
      tries++; videoEl=document.querySelector("video");
      if(videoEl && videoEl.videoWidth>0){
        clearInterval(timer);
        setStatus("Position your face in frame","");
        detectionActive=true;
        requestAnimationFrame(detectLoop);
      } else if(tries>100){
        clearInterval(timer); setStatus("Camera not available","warning");
      }
    },200);
  }

  window.addEventListener("message",(e)=>{
    const msg=e.data||{}; if(!msg.type) return;
    switch(msg.type){
      case "start_face_detection": initializeFaceDetection(); break;
      case "stop_face_detection": cleanup(); break;
      case "capture_now": if(!captureInProgress) captureFaceImage(); break;
    }
  });
})();
</script>
